[_substitutions]
remoteBasePath=/Users/dane/Databright/library
localBasePath=/Users/tqwhite/Documents/webdev/qUtils/system
prodRemoteBasePath=/Users/dane/Databright/libraryTEST
;substitution tags for remoteBasePath are overwritten by deploy-programs when -prod switch is set
;this _substitutions section needs to be manually merged with any other, preexisting _substitutions

[deploy-programs]

;These optional elements do not affect processing. Their purpose is to
;make it easier to keep track of details.

annotation.applicationName=SHOWS UP IN LOG AND HELP MESSAGES, eg, appName
annotation.serverName=SHOWS UP IN LOG AND HELP MESSAGES, eg, prodServer1

serverSpecificInfoList.0=Items from this list appear in the -listActions display
serverSpecificInfoList.1=to detail idiosyncracies of the server.


; sshRemoteActions is optional.
; Either of its action elements, initialization or cleanup, can be omitted.
; These are run before and after *all* the actions steps are executed.
; They can be used alone, without actions steps.

sshRemoteActions.hostName=specificRemoteHost1
sshRemoteActions.initialization.0=echo "initialization task 0 $(date)"
sshRemoteActions.initialization.1=echo "initialization task 1"
sshRemoteActions.cleanup.0=echo 'cleanup 0'
sshRemoteActions.cleanup.1=echo "cleanup 1 $(date)"

; actions are optional.
; Either of its action components, the actual action (source/dest) or ssh can be omitted.
; If only one of source/dest exists, the configuration is invalide.
; If both source and dest reference hostNames that are remote (have an auth component) the configuration is invalid.
; The ssh components, if any, are executed before and after the action (source/dest) step, respectively.
; Annotation is not required but it is very hard to read the logs if it is ommited.
; All rsyncControls are optional. --delete is default.
; 
; By default, the host referenced by the ssh steps is the one extracted from source/dest.
; overrideHostName can be specified if no action (dest/source) is included or there is a reason to operate on a different host.
; The overrideHostName applies to all ssh steps for that action. If multiple hosts need access, a separate actions step can be created without source/dest to reference it.
;
;
; actions steps are specified on the command line, eg
; 	--actions=test1,test2,reverse (note: no spaces are allowed with the commas, the equal sign is optional, replaced with a space)
; They are executed in the order specified.



actions.init.annotation=SSH ONLY, initilizing directories
actions.init.ssh.overrideHostName=specificRemoteHost1
actions.init.ssh.before.0=mkdir -p <!remoteBasePath!>/code'
actions.init.ssh.before.1=mkdir -p <!remoteBasePath!>/configs'
actions.init.ssh.before.3=mkdir -p <!remoteBasePath!>/code'

actions.test1.annotation=send directory to remote with all features example
actions.test1.source.hostName=localhost
actions.test1.source.pathName=rotateLogs
actions.test1.dest.hostName=specificRemoteHost1
actions.test1.dest.pathName=rotateLogs

actions.test1.rsyncControls.exclusions.0=.DS_Store
actions.test1.rsyncControls.exclusions.1=TEMP.js

actions.test1.rsyncControls.suppressDeleteFlag=false

;ssh can act on a different server if overrideHostName is specified
;actions.test1.ssh.overrideHostName=SOMETHERHOST

actions.test1.ssh.before.0=echo '0 before action step r'
actions.test1.ssh.before.1=echo '1 before action step r'

actions.test1.ssh.after.0=echo '0 after action step r'
actions.test1.ssh.after.1=echo '1 after action step r'

;-------------------------------------------------------------------------

actions.sshOnly.annotation=SSH ONLY, no action example
actions.sshOnly.ssh.overrideHostName=specificRemoteHost1
actions.sshOnly.ssh.before.0=echo '0 before sshOnly step r'
actions.sshOnly.ssh.before.1=echo '1 before sshOnly step r'
actions.sshOnly.ssh.after.0=echo '0 after sshOnly step r'
actions.sshOnly.ssh.after.1=echo '1 after sshOnly step r'

;-------------------------------------------------------------------------

actions.test2.annotation=barebones example
actions.test2.source.hostName=localhost
actions.test2.source.pathName=rotateLogs
actions.test2.dest.hostName=specificRemoteHost1
actions.test2.dest.pathName=rotateLogsTEMP

;-------------------------------------------------------------------------

actions.reverse.annotation=retrieve from remote to localhost example
actions.reverse.source.hostName=specificRemoteHost1
actions.reverse.source.pathName=hxConfigsDir
actions.reverse.dest.hostName=localhost
actions.reverse.dest.pathName=rotateLogsTEMP

;-------------------------------------------------------------------------

actions.hostname.annotation=get hostname example
actions.hostname.ssh.overrideHostName=specificRemoteHost1
actions.hostname.ssh.before.0=hostname

;-------------------------------------------------------------------------

; Note: localhost normally acts as the other end of a an interaction with a remote
; server. If actions need to be applied only to localhost, eg, update of files from
; a common library, then a separate sftpHostLib element must be created *with* an
; 'auth' segment. Eg, 'localHostForSSH'. Any .bashrc elements that print to stdout
; must be wrapped so they do not appear for a non-interactive shell or rsync will
; not work.

sftpHostLib.localhost.note=localhost must not have auth property
sftpHostLib.localhost.pathLib.rotateLogs=<!localBasePath!>/code/rotate-logs
sftpHostLib.localhost.pathLib.rotateLogsTEMP=/private/tmp/rotateInTest

sftpHostLib.specificRemoteHost1.auth.host=hitemcoHx.vpn
sftpHostLib.specificRemoteHost1.auth.port=22
sftpHostLib.specificRemoteHost1.auth.username=dane
sftpHostLib.specificRemoteHost1.auth.password=
sftpHostLib.specificRemoteHost1.auth.privateKeyFilePath=/Users/tqwhite/.ssh/tqKey1
sftpHostLib.specificRemoteHost1.pathLib.rotateLogs=<!remoteBasePath!>/rotate-logs/code/rotate-logs
sftpHostLib.specificRemoteHost1.pathLib.rotateLogsTEMP=<!remoteBasePath!>/rotate-logs/code/rotate-logsTEMP
sftpHostLib.specificRemoteHost1.pathLib.hxConfigsDir=<!remoteBasePath!>/helixConnector/system/configs
